name: Build llama.android AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build llama.android lib AAR
        working-directory: llama.cpp/examples/llama.android
        run: |
          ./gradlew :lib:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-lib-release-aar
          path: llama.cpp/examples/llama.android/lib/build/outputs/aar/*.aar
