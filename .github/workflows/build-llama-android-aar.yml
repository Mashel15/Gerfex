name: Build llama.android AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b9780
          path: llama.cpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Patch llama.android lib for Gerfex APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          p = Path("lib/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = 36", "compileSdk = 34")
          s = s.replace("minSdk = 33", "minSdk = 24")
          s = s.replace("minCompileSdk = 35", "minCompileSdk = 34")
          s = s.replace("androidx-core = \"1.17.0\"", "androidx-core = \"1.13.1\"")
          v = Path("gradle/libs.versions.toml")
          vs = v.read_text()
          vs = vs.replace("androidx-core = \"1.17.0\"", "androidx-core = \"1.13.1\"")
          vs = vs.replace("core-ktx = \"1.17.0\"", "core-ktx = \"1.13.1\"")
          v.write_text(vs)
          p.write_text(s)
          lh = Path("lib/src/main/cpp/logging.h")
          ls = lh.read_text()
          ls = ls.replace(
              "return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);",
              "#if __ANDROID_API__ >= 30\\n    return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);\\n#else\\n    return true;\\n#endif"
          )
          lh.write_text(ls)
          print("Patched llama.android logging for minSdk 24")
          print("Patched llama.android lib for Gerfex")
          PATCH

      - name: Build llama.android lib AAR
        working-directory: llama.cpp/examples/llama.android
        run: |
          ./gradlew :lib:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-lib-release-aar
          path: llama.cpp/examples/llama.android/lib/build/outputs/aar/*.aar
